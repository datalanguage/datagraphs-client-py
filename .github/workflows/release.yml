name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run unit tests
        run: uv run pytest tests -v

      - name: Run integration tests
        env:
          API_KEY: ${{ secrets.API_KEY }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
        run: uv run pytest tests_integration -v

  release:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Set up Python
        run: uv python install 3.12

      - name: Bump version
        id: version
        run: |
          current=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          IFS='.' read -r major minor patch <<< "$current"

          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          new="${major}.${minor}.${patch}"
          sed -i "s/^version = \"${current}\"/version = \"${new}\"/" pyproject.toml
          echo "version=${new}" >> "$GITHUB_OUTPUT"
          echo "Bumped version: ${current} -> ${new}"

      - name: Update lockfile
        # Record the new version in uv.lock too, so main's lockfile stays in step
        # with pyproject.toml. The test job's `uv sync --locked` has already shown
        # the lockfile was current, so only the project's version changes here.
        run: uv lock

      - name: Promote changelog section
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          section() {
            awk -v heading="$1" '
              index($0, heading) == 1 { capture = 1; next }
              capture && /^## / { exit }
              capture { print }
            ' CHANGELOG.md
          }

          if ! section "## [Unreleased]" | grep -q '[^[:space:]]'; then
            echo "::warning::CHANGELOG.md [Unreleased] is empty - v${VERSION} will be released with no changelog entries."
            exit 0
          fi

          awk -v ver="$VERSION" -v date="$(date -u +%F)" '
            !promoted && index($0, "## [Unreleased]") == 1 {
              print
              print ""
              print "## [" ver "] - " date
              promoted = 1
              next
            }
            { print }
          ' CHANGELOG.md > CHANGELOG.md.tmp

          mv CHANGELOG.md.tmp CHANGELOG.md
          echo "Promoted [Unreleased] -> [${VERSION}]"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock CHANGELOG.md
          git commit -m "release: v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin main --tags

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

      - name: Prepare release notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="${RUNNER_TEMP}/release-notes.md"

          # Prefer a section already headed with this version; fall back to Unreleased.
          extract() {
            awk -v heading="$1" '
              index($0, heading) == 1 { capture = 1; next }
              capture && /^## / { exit }
              capture { print }
            ' CHANGELOG.md
          }

          extract "## [${VERSION}]" > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            extract "## [Unreleased]" > "$notes"
          fi
          if ! grep -q '[^[:space:]]' "$notes"; then
            printf 'No changelog entries recorded for this release.\n' > "$notes"
          fi

          printf '\n**Install:** `pip install pydatagraphs==%s`\nhttps://pypi.org/project/pydatagraphs/%s/\n' \
            "$VERSION" "$VERSION" >> "$notes"

          echo "file=${notes}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file "${{ steps.notes.outputs.file }}"
